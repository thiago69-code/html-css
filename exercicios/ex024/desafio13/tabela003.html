<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Real</title>
    <style>
        table {
            width: 500px;
            height: 300px;
            border-collapse: collapse;
        }
        th, td {
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Grupo</th>
                <th>Nomes</th>
                <th colspan="3">Filmes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="3">Mulhers</th>
                <td>Ana Maria Santos</td>
                <td>Alien</td>
                <td>Rambo</td>
                <td>Vingadores</td>
            </tr>
            <tr>
                <td>Beatriz Souza</td>
                <td>Hulk</td>
                <td>Bts</td>
                <td>Batman</td>
            </tr>
            <tr>
                <td>Claudia Melo</td>
                <td>Loki</td>
                <td>Matrix</td>
                <td>Big Hero</td>
            </tr>
                <tr>
                    <th rowspan="3">Homens</th>
                        <td>Bruno Henrique</td>
                        <td>Intocáveis</td>
                        <td>Amnésía</td>
                        <td>Gladiador</td>
                </tr>
                <tr>
                    <td>Daniel LaRusso</td>
                    <td>Wall-e</td>
                    <td>Tarzan</td>
                    <td>BBB</td>
                </tr>
                <tr>
                    <td>Fabiano Motta</td>
                    <td>Star Wars 5</td>
                    <td>X-men</td>
                    <td>Toy Story</td>
                </tr>
        </tbody>
    </table>
</body>
</html>
