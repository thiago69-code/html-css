<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        table {
            border-collapse: collapse;
            width: 500px;
            height: 500px;
            text-align: center;
        }
        td {
            border: 1px solid black;
           
        }
    </style>
</head>
<body>
    <table>
        <tbody>
            <tr>
                <td colspan="3">A</td>
                <td rowspan="6">B</td>
               
               
            </tr>
            <tr>
                 <td rowspan="6">C</td>
                 <td>D</td>
                <td>E</td>
                
            </tr>
            <td>F</td>
            <td>G</td>
            <tr>
                
                 <td>H</td>
                <td>I</td>
                 
            </tr>
            <td>J</td> 
            <td>K</td> 
           
            <tr>
                
                <td>L</td>
                <td>M</td>
               
            </tr>
            
            <td colspan="6">N</td>
        </tbody>
    </table>
</body>
</html>
